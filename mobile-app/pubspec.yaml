name: marocloc_mobile
description: Mobile client for the MAROC-LOC PropTech platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.7.0
  http_parser: ^4.0.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.2
  equatable: ^2.0.7
  cached_network_image: ^3.4.1
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.11.0
  shimmer: ^3.0.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: 20.1.0
  web_socket_channel: ^3.0.0
  stomp_dart_client: ^2.0.0
  video_player: ^2.9.1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4
  flutter_tts: ^3.8.5
  speech_to_text: ^7.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  mockito: ^5.4.5
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_square.png"
  adaptive_icon_background: "#0A0F1C"
  adaptive_icon_foreground: "assets/images/logo_square.png"
  min_sdk_android: 21
