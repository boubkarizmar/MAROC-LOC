# ================= DOCKER COMPOSE POUR MAROC-LOC =================

services:

  # ================= DATABASE =================
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: marocloc-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: marocloc_db
      POSTGRES_USER: marocloc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql

    networks:
      - marocloc-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marocloc -d marocloc_db -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10


  # ================= REDIS =================
  redis:
    image: redis:7-alpine
    container_name: marocloc-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

    networks:
      - marocloc-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ================= AI SERVICE =================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    container_name: marocloc-ai
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - chroma_data:/app/chroma_db
      - model_cache:/home/appuser/.cache/huggingface
      - torch_cache:/home/appuser/.cache/torch

    environment:
      DATABASE_URL: postgresql+psycopg2://marocloc:${POSTGRES_PASSWORD}@postgres:5432/marocloc_db
      SESSION_DB_URL: sqlite:////app/chroma_db/ai_sessions.db
      CHROMA_DB_PATH: ./chroma_db
      CHROMA_COLLECTION_NAME: properties
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      LLM_MODEL: google/flan-t5-base
      WHISPER_MODEL: openai/whisper-base
      RAG_TOP_K: "5"
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
      CORS_ORIGINS: '["*"]'

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

    networks:
      - marocloc-network


  # ================= BACKEND =================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure:5

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marocloc_db
      SPRING_DATASOURCE_USERNAME: marocloc
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "6"
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      AI_SERVICE_URL: http://ai-service:8000
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: "900000"
      JWT_REFRESH_EXPIRATION: "604800000"

      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: MAD
      STRIPE_SUCCESS_URL: http://localhost:3000/success
      STRIPE_CANCEL_URL: http://localhost:3000/cancel

      CMI_MERCHANT_ID: ${CMI_MERCHANT_ID}
      CMI_STORE_KEY: ${CMI_STORE_KEY}
      CMI_API_KEY: ${CMI_API_KEY}
      CMI_GATEWAY_URL: https://payment.cmi.co.ma/fim/est3Dgate

      CORS_ALLOWED_ORIGINS: "*"
      SPRING_MAIL_HOST: localhost
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"

      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

    volumes:
      - ./backend/uploads:/app/uploads
      - backend_logs:/app/logs

    networks:
      - marocloc-network


  # ================= FRONTEND =================
  frontend:
    build:
      context: ./frontend

    container_name: marocloc-frontend
    restart: always

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - marocloc-network


# ================= MONITORING =================

  prometheus:
    image: prom/prometheus
    container_name: marocloc-prometheus
    restart: always

    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - marocloc-network


  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: marocloc-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - marocloc-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: marocloc-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://marocloc:${POSTGRES_PASSWORD}@postgres:5432/marocloc_db?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - marocloc-network

  grafana:
    image: grafana/grafana
    container_name: marocloc-grafana
    restart: always

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus
      - postgres

    networks:
      - marocloc-network


# ================= VOLUMES =================
volumes:
  postgres_data:
  redis_data:
  backend_logs:
  chroma_data:
  model_cache:
  torch_cache:
  prometheus_data:
  grafana_data:


# ================= NETWORK =================
networks:
  marocloc-network:
    driver: bridge
