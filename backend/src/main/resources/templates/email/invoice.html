<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Facture</title></head>
<body style="margin:0;padding:0;background:#f5f5f0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="padding:24px 0;">
    <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background:#fff;border-radius:12px;overflow:hidden;">
        <tr>
            <td style="background:linear-gradient(135deg,#00695C 0%,#004D40 100%);padding:40px 24px;text-align:center;">
                <h1 style="color:#fff;margin:0;font-size:26px;letter-spacing:2px;">📄 Facture</h1>
            </td>
        </tr>
        <tr><td style="padding:32px 24px;">
            <p style="color:#444;line-height:1.7;">Voici votre facture pour les services MAROC-LOC :</p>
            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f8f9fa;border-radius:8px;margin:20px 0;">
                <tr><td style="padding:16px 20px;border-bottom:1px solid #e0e0e0;">
                    <span style="color:#888;font-size:13px;">N° Facture</span>
                    <p style="margin:4px 0 0;font-weight:600;color:#333;" th:text="${invoiceNumber}">FAC-001</p>
                </td></tr>
                <tr><td style="padding:16px 20px;border-bottom:1px solid #e0e0e0;">
                    <span style="color:#888;font-size:13px;">Montant TTC</span>
                    <p style="margin:4px 0 0;font-weight:600;color:#333;font-size:18px;" th:text="${amount} + ' MAD'">0 MAD</p>
                </td></tr>
                <tr><td style="padding:16px 20px;">
                    <span style="color:#888;font-size:13px;">Statut</span>
                    <p style="margin:4px 0 0;font-weight:600;color:#27ae60;">Payée</p>
                </td></tr>
            </table>
            <p style="font-size:12px;color:#888;">
                Conservez cette facture pour vos dossiers comptables. Pour toute question, contactez finance@marocloc.ma
            </p>
        </td></tr>
        <tr><td style="background:#f0f0eb;padding:24px;text-align:center;font-size:12px;color:#666;">
            <p style="margin:0;">© 2026 MAROC-LOC · Casablanca, Maroc</p>
        </td></tr>
    </table>
    </td></tr></table>
</body>
</html>
