# ===============================================
# MAROC-LOC Backend - Docker Profile Configuration
# ===============================================

# ==================== UTF-8 ENCODING ====================
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.enabled=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.jackson.encoding=UTF-8
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# -------------------- SERVER --------------------
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.tomcat.threads.max=200
server.tomcat.connection-timeout=20000
server.servlet.context-path=/api
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/octet-stream
server.compression.excluded-user-agents=gozilla, traviata

# -------------------- DATABASE (PostgreSQL with PostGIS) --------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/marocloc_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:marocloc}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# -------------------- JPA / HIBERNATE --------------------
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.max_fetch_depth=3
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
spring.jpa.properties.hibernate.integration.spatial.enabled=true

# Jackson Configuration for Java 8 Date/Time
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.datatype.jsr310.enabled=true

# -------------------- FLYWAY --------------------
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:6}

# -------------------- REDIS --------------------
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# -------------------- JWT SECURITY --------------------
jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

encryption.secret=${ENCRYPTION_SECRET}

# -------------------- CORS --------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true

# -------------------- FILE UPLOADS --------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true
upload.path=/app/uploads
upload.allowed-extensions=jpg,jpeg,png,pdf,doc,docx

# -------------------- MANAGEMENT / ACTUATOR --------------------
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus,metrics}
management.endpoints.web.base-path=/actuator
management.metrics.export.prometheus.enabled=${MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED:true}
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=marocloc-backend
management.metrics.tags.instance=${HOSTNAME:localhost}
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.diskspace.enabled=true

# -------------------- LOGGING --------------------
logging.level.root=INFO
logging.level.com.marocloc=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.path=/app/logs
logging.file.name=${logging.file.path}/marocloc-backend.log

# -------------------- RATE LIMITING --------------------
rate-limit.enabled=true
rate-limit.capacity=100
rate-limit.refill-interval=60
rate-limit.refill-tokens=10

# -------------------- MAROC-LOC AI Service --------------------
ai.service.url=http://ai-service:8000

# -------------------- ENCRYPTION --------------------
# encryption.secret is used by StringEncryptor for field-level AES-GCM
# encryption.secret-key and encryption.salt are deprecated; use encryption.secret only

# -------------------- EUREKA --------------------
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# -------------------- CACHE --------------------
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=marocloc

spring.jpa.open-in-view=false

# -------------------- SPRING DOC OPENAPI --------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=true
# Exclude mail autoconfiguration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Fix circular dependency between Flyway and EntityManagerFactory
spring.jpa.defer-datasource-initialization=false
spring.flyway.repair-on-migrate=true
