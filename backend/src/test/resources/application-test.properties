spring.jpa.hibernate.ddl-auto=create-drop
# Dialect auto-detected by Hibernate 6

jwt.secret=TestSecretKeyForUnitTestsMustBeAtLeast32Chars
jwt.access.expiration=60000
jwt.refresh.expiration=120000

encryption.secret=TestEncryptionSecret32CharsLong!!!

stripe.api.key=test_stripe_api_key_for_tests_only
stripe.webhook.secret=test_stripe_webhook_secret_for_tests_only

spring.mail.host=localhost
spring.mail.port=1025

spring.kafka.bootstrap-servers=localhost:9092

spring.flyway.enabled=false

# Disable Eureka in tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
