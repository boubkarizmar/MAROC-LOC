apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: marocloc
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:latest
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-init
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: clickhouse-init
          configMap:
            name: clickhouse-init-sql
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: marocloc
spec:
  selector:
    app: clickhouse
  ports:
    - port: 8123
      targetPort: 8123
      name: http
    - port: 9000
      targetPort: 9000
      name: native
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-init-sql
  namespace: marocloc
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS marocloc_analytics;
    USE marocloc_analytics;
    CREATE TABLE IF NOT EXISTS events (
        event_id UUID,
        event_type LowCardinality(String),
        user_id UInt64,
        server_timestamp DateTime64(3),
        payload String
    ) ENGINE = MergeTree()
    ORDER BY (event_type, server_timestamp, user_id)
    PARTITION BY toYYYYMM(server_timestamp);
