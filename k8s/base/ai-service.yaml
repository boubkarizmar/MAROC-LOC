apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: marocloc
  labels:
    app: ai-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: marocloc/ai-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-service-config
            - secretRef:
                name: marocloc-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://marocloc:$(POSTGRES_PASSWORD)@postgres:5432/marocloc_db"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - name: mlflow-data
              mountPath: /app/mlflow
            - name: model-weights
              mountPath: /app/model_weights
      volumes:
        - name: mlflow-data
          emptyDir: {}
        - name: model-weights
          persistentVolumeClaim:
            claimName: model-weights-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: marocloc
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service-hpa
  namespace: marocloc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Pods
      pods:
        metric:
          name: ai_request_latency_p99
        target:
          type: AverageValue
          averageValue: "300m"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
        value: 100
        periodSeconds: 30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-weights-pvc
  namespace: marocloc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
