<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title">
    <title id="title">Hero illustration</title>
    <defs>
        <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#70c9ff" />
            <stop offset="100%" stop-color="#ffffff" />
        </linearGradient>
        <linearGradient id="groundGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#86d067" />
            <stop offset="100%" stop-color="#4a8c3b" />
        </linearGradient>
        <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f47cb0" />
            <stop offset="100%" stop-color="#ff7f50" />
        </linearGradient>
        <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.2"/>
        </filter>
    </defs>

    <rect width="1200" height="700" fill="url(#skyGradient)" />
    <rect y="420" width="1200" height="280" fill="url(#groundGradient)" />
    <path d="M0 460 L280 360 L500 480 L760 320 L1200 460 L1200 700 L0 700 Z" fill="#57a754" opacity="0.9" />

    <g filter="url(#softShadow)">
        <circle cx="340" cy="320" r="70" fill="#fff7e6" />
        <circle cx="325" cy="310" r="7" fill="#3b3b3b" />
        <circle cx="355" cy="310" r="7" fill="#3b3b3b" />
        <path d="M315 340 Q340 360 365 340" stroke="#3b3b3b" stroke-width="6" fill="none" stroke-linecap="round"/>

        <path d="M300 390 C280 470 320 540 350 540 C380 540 410 470 390 390 Z" fill="url(#heroGradient)" />
        <rect x="333" y="440" width="34" height="75" fill="#fff" opacity="0.4" rx="8"/>
        <path d="M320 420 L290 500 L305 505 L330 435 Z" fill="#ffb4d5"/>
        <path d="M380 420 L410 500 L395 505 L370 435 Z" fill="#ffb4d5"/>
    </g>

    <g fill="#ffffff" opacity="0.8">
        <circle cx="860" cy="120" r="8"/>
        <circle cx="920" cy="80" r="12"/>
        <circle cx="760" cy="100" r="6"/>
        <circle cx="1040" cy="140" r="9"/>
        <circle cx="980" cy="180" r="5"/>
    </g>

    <path d="M620 280 L720 220 L760 310 L700 330 Z" fill="#ffdd57" opacity="0.8" />
    <path d="M630 300 L710 240 L740 320 L690 340 Z" fill="#fff6b0" opacity="0.75" />

    <text x="60" y="80" font-family="Inter,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#1a3d5e">
        Create, build, launch
    </text>
    <text x="60" y="130" font-family="Inter,Helvetica,Arial,sans-serif" font-size="32" fill="#3b5f7b">
        Your project starts here
    </text>
</svg>