# Microservices decomposition (future)
# Splits the monolithic backend into independent services.
# Usage: docker compose -f docker-compose.yml -f docker/docker-compose.microservices.yml up -d

services:
  user-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marocloc-user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,microservices
      SERVICE_NAME: user-service
    ports:
      - "8081:8080"
    networks:
      - marocloc-network

  property-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marocloc-property-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,microservices
      SERVICE_NAME: property-service
    ports:
      - "8082:8080"
    networks:
      - marocloc-network

  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marocloc-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,microservices
      SERVICE_NAME: notification-service
    ports:
      - "8083:8080"
    networks:
      - marocloc-network
