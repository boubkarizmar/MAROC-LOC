global:
  resolve_timeout: 5m
  # Comment out slack_api_url if you don't have Slack
  # slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://grafana:3000/api/alertmanager'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://grafana:3000/api/alertmanager'
        send_resolved: true

  - name: 'warning'
    webhook_configs:
      - url: 'http://grafana:3000/api/alertmanager'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']