global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'marocloc-monitor'
    environment: 'docker'

# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

rule_files:
  - '/etc/prometheus/rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 10s

  # Spring Boot Backend metrics
  - job_name: 'marocloc-backend'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
    scrape_interval: 15s

  # Redis metrics (via redis_exporter)
  - job_name: 'marocloc-redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # PostgreSQL metrics (via postgres_exporter)
  - job_name: 'marocloc-postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # cAdvisor container metrics (disabled - service not in compose)
  # - job_name: 'marocloc-containers'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #   scrape_interval: 15s

  # FastAPI AI Service
  - job_name: 'marocloc-ai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-service:8000']
    scrape_interval: 30s

  # Node Exporter metrics (disabled - service not in compose)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #   scrape_interval: 15s
