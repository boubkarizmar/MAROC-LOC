clients:
  - url: http://loki:3100/loki/api/v1/push

positions:
  filename: /tmp/positions.yaml

scrape_configs:
  # Docker container logs - FIXED
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

  # Spring Boot Backend logs
  - job_name: marocloc-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: marocloc-backend
          service: backend
          environment: docker
    pipeline_stages:
      - regex:
          expression: '(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) \[(?P<thread>[^\]]+)\] (?P<level>\w+) (?P<logger>[^ ]+) - (?P<message>.*)'

  # AI Service logs
  - job_name: marocloc-ai
    static_configs:
      - targets:
          - localhost
        labels:
          job: marocloc-ai
          service: ai
          environment: docker